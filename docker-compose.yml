services:
  postgres:
    image: postgres:16
    container_name: librotech-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - librotech_data:/var/lib/postgresql/data

volumes:
  librotech_data: