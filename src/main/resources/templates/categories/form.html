<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${screenTitle}">Category Form</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { padding: 8px; width: 300px; }
        button { padding: 10px 15px; background-color: #4CAF50; color: white; border: none; cursor: pointer; }
        .btn-cancel { background-color: #f44336; text-decoration: none; display: inline-block; padding: 10px 15px; color: white; }
        .error { background-color: #f8d7da; color: #721c24; padding: 10px; border-radius: 5px; margin-bottom: 15px; }
    </style>
</head>
<body>
<div th:replace="~{layout/components :: navbar}"></div>
<div style="margin: 20px;">
    <h1 th:text="${screenTitle}">New Category</h1>
    <div th:if="${nameError}" class="error">
        <strong th:text="${nameError}"></strong>
    </div>
    <form th:action="@{/admin/categories/save}" th:object="${category}" method="post">
        <div class="form-group">
            <label>Name:</label>
            <input type="text" th:field="*{name}" />
        </div>
        <div class="form-group">
            <label>Description:</label>
            <input type="text" th:field="*{description}" />
        </div>
        <button type="submit">Save Category</button>
        <a th:href="@{/admin/categories}" class="btn-cancel">Cancel</a>
    </form>
</div>
<div th:replace="~{layout/components :: footer}"></div>
</body>
</html>
