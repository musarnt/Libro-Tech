<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Fragment: HEAD (Tailwind + dark mode + sidebar state) -->
<th:block th:fragment="head">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        accent: {
                            50:  '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857'
                        }
                    }
                }
            }
        };
        // Apply theme + sidebar state before paint (no flash)
        if (localStorage.getItem('theme') === 'dark' ||
            (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
        if (localStorage.getItem('sidebar') === 'collapsed') {
            document.documentElement.classList.add('sidebar-collapsed');
        }
    </script>
    <style>
        /* Sidebar collapsed state */
        html.sidebar-collapsed #sidebar { transform: translateX(-100%); }
        html.sidebar-collapsed .main-content { margin-left: 0; }
        html:not(.sidebar-collapsed) .main-content { margin-left: 15rem; }
        #sidebar, .main-content { transition: all 0.2s ease; }
    </style>
</th:block>

<!-- Fragment: SIDEBAR -->
<aside th:fragment="sidebar" id="sidebar"
       class="fixed inset-y-0 left-0 w-60 z-30 bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800 flex flex-col">
    <div class="px-6 py-5 border-b border-gray-200 dark:border-gray-800">
        <h2 class="text-lg font-semibold text-gray-900 dark:text-white flex items-center gap-2">
            <span class="text-accent-500">📚</span> LibroTech
        </h2>
        <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Admin Panel</p>
    </div>

    <nav class="flex-1 px-3 py-4 space-y-1">
        <a th:href="@{/admin/books}"
           class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-accent-50 dark:hover:bg-gray-800 hover:text-accent-600 dark:hover:text-accent-500 transition">
            <span>📖</span> Books
        </a>
        <a th:href="@{/admin/categories}"
           class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-accent-50 dark:hover:bg-gray-800 hover:text-accent-600 dark:hover:text-accent-500 transition">
            <span>🏷️</span> Categories
        </a>
        <a th:href="@{/admin/genres}"
           class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-accent-50 dark:hover:bg-gray-800 hover:text-accent-600 dark:hover:text-accent-500 transition">
            <span>🎭</span> Genres
        </a>
        <a th:href="@{/admin/publishers}"
           class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-accent-50 dark:hover:bg-gray-800 hover:text-accent-600 dark:hover:text-accent-500 transition">
            <span>🏢</span> Publishers
        </a>
    </nav>

    <div class="px-3 py-4 border-t border-gray-200 dark:border-gray-800">
        <a th:href="@{/swagger-ui/index.html}" target="_blank"
           class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition">
            <span>🔌</span> Swagger API
        </a>
    </div>
</aside>

<!-- Fragment: TOP BAR with hamburger + theme toggle -->
<header th:fragment="topbar"
        class="main-content h-16 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 flex items-center justify-between px-6 sticky top-0 z-20">
    <button onclick="toggleSidebar()"
            class="p-2 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition"
            title="Toggle sidebar">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
    </button>

    <button onclick="toggleTheme()"
            class="p-2 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition"
            title="Toggle theme">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
        </svg>
    </button>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
        }
        function toggleSidebar() {
            const html = document.documentElement;
            html.classList.toggle('sidebar-collapsed');
            localStorage.setItem('sidebar', html.classList.contains('sidebar-collapsed') ? 'collapsed' : 'expanded');
        }
    </script>
</header>

<!-- Fragment: FOOTER -->
<footer th:fragment="footer"
        class="main-content text-center py-6 text-xs text-gray-500 dark:text-gray-400 border-t border-gray-200 dark:border-gray-800 mt-auto">
    &copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2026</span> LibroTech — Library Management System
</footer>

</body>
</html>
