<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!-- This file is not rendered on its own, it only stores fragments -->
<body>

<!-- Fragment: Navbar -->
<header th:fragment="navbar" style="background-color: #333; color: white; padding: 15px;">
    <h2 style="margin: 0; display: inline-block;">📚 LibroTech Admin</h2>
    <nav style="display: inline-block; margin-left: 20px;">
        <a th:href="@{/admin/books}" style="color: white; margin-right: 15px;">Catalog</a>
        <a th:href="@{/api/books}" target="_blank" style="color: #aaa;">View JSON API</a>
    </nav>
</header>

<!-- Fragment: Footer -->
<footer th:fragment="footer" style="text-align: center; padding: 20px; color: #777; margin-top: 40px; border-top: 1px solid #ddd;">
    <p>&copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2026</span> LibroTech - Library Management System</p>
</footer>

</body>
</html>
