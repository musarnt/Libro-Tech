<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${screenTitle}">Publisher Catalog</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .empty-state { color: #888; font-style: italic; }
        .btn-delete { background-color: #f44336; color: white; border: none; padding: 5px 10px; cursor: pointer; }
        .btn-edit { background-color: #ff9800; color: white; padding: 5px 10px; text-decoration: none; margin-right: 5px; }
    </style>
</head>
<body>
<div th:replace="~{layout/components :: navbar}"></div>
<div style="margin: 20px;">
    <h1 th:text="${screenTitle}">Publisher List</h1>
    <div style="margin-bottom: 20px;">
        <a th:href="@{/admin/publishers/new}"
           style="padding: 10px; background-color: #008CBA; color: white; text-decoration: none;">
            + Add New Publisher
        </a>
    </div>
    <div th:if="${#lists.isEmpty(publishers)}" class="empty-state">
        <p>No publishers registered yet.</p>
    </div>
    <table th:unless="${#lists.isEmpty(publishers)}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Country</th>
            <th>Address</th>
            <th>Founded In</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="publisher : ${publishers}">
            <td th:text="${publisher.id}"></td>
            <td th:text="${publisher.name}"></td>
            <td th:text="${publisher.country}"></td>
            <td th:text="${publisher.address}"></td>
            <td th:text="${publisher.foundedIn}"></td>
            <td>
                <a th:href="@{/admin/publishers/{id}/edit(id=${publisher.id})}" class="btn-edit">Edit</a>
                <form th:action="@{/admin/publishers/delete/{id}(id=${publisher.id})}" method="post"
                      style="display:inline" onsubmit="return confirm('Are you sure?')">
                    <button type="submit" class="btn-delete">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<div th:replace="~{layout/components :: footer}"></div>
</body>
</html>
