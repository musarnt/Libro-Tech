<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${screenTitle}">Book Catalog</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .empty-state { color: #888; font-style: italic; }
    </style>
</head>
<body>

<!-- Activity 2: Inject navbar from layout/components.html -->
<div th:replace="~{layout/components :: navbar}"></div>

<div style="margin: 20px;">

    <h1 th:text="${screenTitle}">Book List</h1>

    <div style="margin-bottom: 20px;">
        <a th:href="@{/admin/books/new}"
           style="padding: 10px; background-color: #008CBA; color: white; text-decoration: none;">
            + Add New Book
        </a>
    </div>

    <div th:if="${#lists.isEmpty(books)}" class="empty-state">
        <p>No books registered in the system yet.</p>
    </div>

    <table th:unless="${#lists.isEmpty(books)}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>ISBN</th>
            <th>Year</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="book : ${books}">
            <td th:text="${book.id}">1</td>
            <td th:text="${book.title}">The Quixote</td>
            <td th:text="${book.author}">Cervantes</td>
            <td th:text="${book.isbn}">123-456</td>
            <td th:text="${book.yearPublication}">1605</td>
        </tr>
        </tbody>
    </table>

</div>

<!-- Activity 2: Inject footer from layout/components.html -->
<div th:replace="~{layout/components :: footer}"></div>

</body>
</html>
