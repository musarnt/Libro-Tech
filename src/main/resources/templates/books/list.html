<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${screenTitle}">Book Catalog</title>
    <th:block th:replace="~{layout/components :: head}"></th:block>
</head>
<body class="bg-gray-50 dark:bg-gray-950 min-h-screen">
<div th:replace="~{layout/components :: sidebar}"></div>
<div th:replace="~{layout/components :: topbar}"></div>

<main class="main-content p-8">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-semibold text-gray-900 dark:text-white" th:text="${screenTitle}">Book Catalog</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Manage your library books</p>
        </div>
        <a th:href="@{/admin/books/new}"
           class="inline-flex items-center gap-2 px-4 py-2 bg-accent-600 hover:bg-accent-700 text-white text-sm font-medium rounded-lg transition">
            <span>+</span> Add New Book
        </a>
    </div>

    <div th:if="${#lists.isEmpty(books)}"
         class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-lg p-12 text-center">
        <p class="text-gray-500 dark:text-gray-400 italic">No books registered in the system yet.</p>
    </div>

    <div th:unless="${#lists.isEmpty(books)}"
         class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-lg overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-gray-50 dark:bg-gray-800 text-left text-xs uppercase text-gray-500 dark:text-gray-400">
            <tr>
                <th class="px-6 py-3 font-medium">ID</th>
                <th class="px-6 py-3 font-medium">Title</th>
                <th class="px-6 py-3 font-medium">Author</th>
                <th class="px-6 py-3 font-medium">ISBN</th>
                <th class="px-6 py-3 font-medium">Year</th>
                <th class="px-6 py-3 font-medium text-right">Actions</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-gray-200 dark:divide-gray-800">
            <tr th:each="book : ${books}" class="hover:bg-gray-50 dark:hover:bg-gray-800/50 transition">
                <td class="px-6 py-3 text-gray-500 dark:text-gray-400" th:text="${book.id}"></td>
                <td class="px-6 py-3 font-medium text-gray-900 dark:text-white" th:text="${book.title}"></td>
                <td class="px-6 py-3 text-gray-700 dark:text-gray-300" th:text="${book.author}"></td>
                <td class="px-6 py-3 text-gray-500 dark:text-gray-400" th:text="${book.isbn}"></td>
                <td class="px-6 py-3 text-gray-700 dark:text-gray-300" th:text="${book.yearPublication}"></td>
                <td class="px-6 py-3 text-right">
                    <a th:href="@{/admin/books/{id}/edit(id=${book.id})}"
                       class="inline-block px-3 py-1 text-xs font-medium text-amber-700 dark:text-amber-400 bg-amber-50 dark:bg-amber-900/20 hover:bg-amber-100 dark:hover:bg-amber-900/40 rounded-md transition mr-2">Edit</a>
                    <form th:action="@{/admin/books/delete/{id}(id=${book.id})}" method="post"
                          class="inline" onsubmit="return confirm('Are you sure?')">
                        <button type="submit"
                                class="px-3 py-1 text-xs font-medium text-red-700 dark:text-red-400 bg-red-50 dark:bg-red-900/20 hover:bg-red-100 dark:hover:bg-red-900/40 rounded-md transition">
                            Delete
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <!-- Pagination footer -->
        <div class="flex items-center justify-between px-6 py-4 border-t border-gray-200 dark:border-gray-800">
            <span class="text-sm text-gray-500 dark:text-gray-400">
                Page <span class="font-medium text-gray-700 dark:text-gray-300" th:text="${currentPage + 1}">1</span>
            </span>

            <div class="inline-flex rounded-lg overflow-hidden border border-gray-200 dark:border-gray-700">
                <a th:if="${hasPrevious}"
                   th:href="@{/admin/books(page=${currentPage - 1})}"
                   class="px-4 py-2 text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-accent-600 hover:text-white dark:hover:bg-accent-600 transition border-r border-gray-200 dark:border-gray-700">
                    &larr; Previous
                </a>
                <span th:unless="${hasPrevious}"
                      class="px-4 py-2 text-sm font-medium text-gray-300 dark:text-gray-600 border-r border-gray-200 dark:border-gray-700 cursor-not-allowed">
                    &larr; Previous
                </span>

                <a th:if="${hasNext}"
                   th:href="@{/admin/books(page=${currentPage + 1})}"
                   class="px-4 py-2 text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-accent-600 hover:text-white dark:hover:bg-accent-600 transition">
                    Next &rarr;
                </a>
                <span th:unless="${hasNext}"
                      class="px-4 py-2 text-sm font-medium text-gray-300 dark:text-gray-600 cursor-not-allowed">
                    Next &rarr;
                </span>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout/components :: footer}"></div>
</body>
</html>
