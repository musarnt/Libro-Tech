<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${screenTitle}">Book Form</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { padding: 8px; width: 300px; }
        button { padding: 10px 15px; background-color: #4CAF50; color: white; border: none; cursor: pointer; }
        .btn-cancel { background-color: #f44336; text-decoration: none; display: inline-block; padding: 10px 15px; color: white; }
    </style>
</head>
<body>
<div th:replace="~{layout/components :: navbar}"></div>
<div style="margin: 20px;">
    <h1 th:text="${screenTitle}">New Book</h1>

    <div th:if="${yearError}"
         style="background-color: #f8d7da; color: #721c24; padding: 10px; border-radius: 5px; margin-bottom: 15px;">
        <strong th:text="${yearError}">Generic error message</strong>
    </div>

    <form th:action="@{/admin/books/save}" th:object="${book}" method="post">
        <div class="form-group">
            <label>Book Title:</label>
            <input type="text" th:field="*{title}" required />
        </div>
        <div class="form-group">
            <label>Author:</label>
            <input type="text" th:field="*{author}" required />
        </div>
        <div class="form-group">
            <label>ISBN:</label>
            <input type="text" th:field="*{isbn}" required />
        </div>
        <div class="form-group">
            <label>Publication Year:</label>
            <input type="number" th:field="*{yearPublication}" required />
        </div>
        <div class="form-group">
            <label>Category:</label>
            <select th:field="*{category.id}">
                <option value="">-- Select Category --</option>
                <option th:each="cat : ${categories}"
                        th:value="${cat.id}"
                        th:text="${cat.name}"/>
            </select>
        </div>
        <div class="form-group">
            <label>Publisher:</label>
            <select th:field="*{publisher.id}">
                <option value="">-- Select Publisher --</option>
                <option th:each="pub : ${publishers}"
                        th:value="${pub.id}"
                        th:text="${pub.name}"/>
            </select>
        </div>
        <div class="form-group">
            <label>Genres:</label>
            <div th:each="genre : ${genres}">
                <input type="checkbox"
                       th:value="${genre.id}"
                       name="genreIds"
                       th:checked="${book.genres != null and book.genres.contains(genre)}"/>
                <label th:text="${genre.name}"/>
            </div>
        </div>

        <button type="submit">Save Book</button>
        <a th:href="@{/admin/books}" class="btn-cancel">Cancel</a>
    </form>
</div>
<div th:replace="~{layout/components :: footer}"></div>
</body>
</html>
